<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta amb IA: Pla d'Infància i Adolescència</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
        }
        h1 {
            color: #0056b3;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #0056b3;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #004085;
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        #resposta {
            margin-top: 30px;
            padding: 15px;
            border-left: 4px solid #0056b3;
            background-color: #f8f9fa;
            white-space: pre-wrap;
            display: none;
        }
        .error {
            border-left-color: #dc3545 !important;
            color: #721c24;
            background-color: #f8d7da !important;
        }
    </style>
</head>
<body>

    <h1>Consulta amb IA: Pla d'Infància i Adolescència</h1>
    <p>Fes qualsevol consulta sobre aquest pla municipal de Riba-roja de Túria i l'assistent et respondrà basant-se en el document oficial.</p>

    <div class="form-group">
        <input type="email" id="email" placeholder="El teu correu electrònic (opcional, per si la IA necessita consultar l'observador)">
    </div>

    <div class="form-group">
        <input type="text" id="pregunta" placeholder="Ex: Quantes parts té el pla?" required>
    </div>

    <button id="btnConsultar" onclick="executarConsulta()">Consultar</button>

    <div id="contenidorResposta" style="margin-top: 30px; display: none;">
        <h3>Resposta de l'Assistent:</h3>
        <div id="resposta"></div>
    </div>

    <script>
        const WORKER_URL = 'https://gemini-proxy-riba-roja.francesc-j-hernandez.workers.dev';

        async function executarConsulta() {
            const preguntaInput = document.getElementById('pregunta');
            const emailInput = document.getElementById('email');
            const btn = document.getElementById('btnConsultar');
            const respostaDiv = document.getElementById('resposta');
            const contenidorResposta = document.getElementById('contenidorResposta');

            const pregunta = preguntaInput.value.trim();
            const email = emailInput.value.trim();

            if (!pregunta) {
                alert('Per favor, escriu una pregunta.');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Consultant...';
            contenidorResposta.style.display = 'block';
            respostaDiv.className = '';
            respostaDiv.style.display = 'block';
            respostaDiv.innerText = 'Processant la teua consulta...';

            const bodyPeticio = {
                contents: [{
                    parts: [{
                        text: `Context: Ets un assistent virtual especialitzat en el Pla d'Infància i Adolescència de Riba-roja de Túria. Respon a la següent pregunta de l'usuari (${email ? 'Correu: ' + email : 'Anònim'}):\n\n${pregunta}`
                    }]
                }]
            };

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyPeticio)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || `Error de l'API (${response.status})`);
                }

                if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                    respostaDiv.innerText = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    throw new Error(data.error.message);
                } else {
                    respostaDiv.innerText = 'No s\'ha pogut obtindre una resposta vàlida de l\'assistent.';
                }

            } catch (err) {
                respostaDiv.className = 'error';
                respostaDiv.innerText = `S'ha produït un error de connexió o de processament: ${err.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = 'Consultar';
            }
        }
    </script>

</body>
</html>
